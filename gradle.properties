# Mémoire allouée à Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Les chemins propres au poste (l'entrepôt S:\18, l'instance PrismLauncher, PackTool) et le
# joueur des runs client, propre à la personne (outfitter.username, outfitter.login), ne
# sont PAS ici : ils vivent dans machine.properties, qui n'est jamais versionné, sous les
# clés outfitter.* que le plugin lit. Un clone n'hérite ainsi ni des chemins ni du pseudo de
# l'auteur. Voir le README.

# D'où vient Outfitter, le plugin des environnements de développement : composite (les
# sources fraîches de S:\16\_V\Outfitter, le défaut) ou repsy (l'artefact publié sur
# Repsy, à la version du catalogue libs ; celui d'un clone qui n'a pas le voisin). Se
# surcharge à la commande : -Poutfitter_source=repsy. Voir settings.gradle.kts.
outfitter_source=composite

# Mod Properties
# mod_id est l'identifiant Fabric, déclaré UNE seule fois : processResources l'injecte
# dans fabric.mod.json, le build s'en sert (bloc mods de Loom, groupe de tâches) et
# Outfitter aussi (nom du jar déployé, mod jamais recopié depuis l'instance, logger de
# levels.xml).
mod_id=travellingdimension
mod_version=2.9.0
maven_group=fr.roumoulou
archives_base_name=travellingdimension

# La publication sur Modrinth et CurseForge (section 10 du plugin de version) : les deux
# projets, par leurs identifiants, publics et stables. Celui de Modrinth est l'identifiant
# à huit caractères de la page du projet, pas son adresse ; vide, l'envoi réel refuse.
# Les jetons ne vivent jamais ici : MODRINTH_TOKEN et CURSEFORGE_TOKEN, posés par
# dev-secrets.ps1 dans le terminal qui publie. Un envoi réel se demande à la commande,
# -Ppublish_live=true ; sans lui, publishMods est un essai à blanc.
modrinth_project_id=HJManmRz
curseforge_project_id=1720613

# Les maps de l'entrepôt copiées dans les saves des clients de dev : noms exacts,
# séparés par des virgules, catégorie jamais mentionnée. Clé absente ou vide :
# toutes les maps de l'entrepôt. machine.properties peut la surcharger par poste.
# Le monde du serveur ne dépend pas d'elle (voir outfitter.server_world), et retirer
# une map d'ici n'efface pas sa copie déjà dans un environnement.
outfitter.maps=World_Flat_MushroomFields, \
  Learn Logic Gates, \
  Redstone Fully Explained, \
  Redstone Tutorial World, \
  All Redstone Circuits and Logic Gates, \
  Resource Pack Showcase 1.21.4

# Le monde de départ des serveurs de dev (runServer et runServerModded), copié sous `world` :
# un nom exact de l'entrepôt de maps. Vide, c'est la clé "world" du profile.json du profil
# `dev` de l'entrepôt qui décide, sinon la première map par ordre alphabétique. Un nom
# introuvable est signalé et retombe au cran suivant. machine.properties peut surcharger.
outfitter.server_world=

# Mods de l'instance à ne JAMAIS copier dans les environnements moddés : identifiants
# Fabric (champ id du fabric.mod.json), séparés par des virgules ; machine.properties peut
# surcharger par poste. Pour les mods qui cassent les runs sans casser l'instance.
# L'entrée du jour : le duo MaLiLib + World Map crashe au premier tick DANS LES RUNS
# seulement (Missing uniform Globals, animation d'atlas), mesuré le 2026-09-13 et rejoué à
# l'identique le 2026-09-25 sous Iris 1.11.4 et Sodium 0.9.2. Le mécanisme est une
# fragilité de vanilla 26.2, analysée dans 06-ai-fourre-tout/2026-09-25/ ; l'instance Prism,
# elle, ne crashe pas. À retirer quand Mojang ou Xaero auront corrigé.
outfitter.mods_exclude=xaeroworldmap

# Le projet de modpack que PackTool sert pour les packs, datapacks et réglages des
# environnements moddés : son identifiant, stable, quand le dossier porte l'année.
# Le chemin de PackTool, lui, est propre au poste : machine.properties.
outfitter.content_project=mdtk

# Les logs des runs, trois clés indépendantes (les montages log4j sont des ressources
# d'Outfitter, extraits dans build\outfitter\log4j\ avant chaque run).
# outfitter.log_level règle la console de TOUT LE MONDE (trace, debug, info, warn, error ;
# vide = info, le défaut Fabric) ; outfitter.mod_log_level ne règle que le logger du mod,
# pour voir son debug ou son trace sans le bruit des autres. machine.properties peut
# surcharger par poste, -P dépanne ponctuellement, et logs/debug.log reçoit toujours
# tout, quels que soient ces réglages.
outfitter.log_level=info
outfitter.mod_log_level=trace

# Le FORMAT de la console : vide = l'habillage de Loom ; `compact` (une ligne, emoji
# par niveau, héritier du soft-compact d'Enhanced Terminal Logging) ou `details`
# (deux lignes avec Classe::Méthode(Ligne) et PID, le diagnostic poussé, plus lent).
outfitter.log_format=compact
