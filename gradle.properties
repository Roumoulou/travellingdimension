# Mémoire allouée à Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Le chemin de l'instance PrismLauncher n'est PAS ici : il est propre à chaque
# machine, donc il vit dans machine.properties, qui n'est jamais versionné.
# Voir la section 1 du build et le README.

# Mod Properties
# mod_id est l'identifiant Fabric, déclaré UNE seule fois : processResources
# l'injecte dans fabric.mod.json et le build s'en sert partout (déploiements,
# exclusion de la sync, bloc mods de Loom, groupes de tâches).
mod_id=travellingdimension
mod_version=2.7.0
maven_group=fr.roumoulou
archives_base_name=travellingdimension

# Les maps de l'entrepôt copiées dans les saves des clients de dev : noms exacts,
# séparés par des virgules, catégorie jamais mentionnée. Clé absente ou vide :
# toutes les maps de l'entrepôt. machine.properties peut la surcharger par poste.
# Le monde du serveur ne dépend pas d'elle (il reste déclaré par le profil dev de
# l'entrepôt), et retirer une map d'ici n'efface pas sa copie déjà dans un run.
dev_maps=World_Flat_MushroomFields, \
  Learn Logic Gates, \
  Redstone Fully Explained, \
  Redstone Tutorial World, \
  All Redstone Circuits and Logic Gates, \
  Resource Pack Showcase 1.21.4
