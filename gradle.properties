# Mémoire allouée à Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Le chemin de l'instance PrismLauncher n'est PAS ici : il est propre à chaque
# machine, donc il vit dans machine.properties, qui n'est jamais versionné.
# Voir la section 1 du build et le README.

# Mod Properties
# mod_id est l'identifiant Fabric, déclaré UNE seule fois : processResources
# l'injecte dans fabric.mod.json et le build s'en sert partout (déploiements,
# exclusion de la sync, bloc mods de Loom, groupes de tâches).
mod_id=travellingdimension
mod_version=2.7.0
maven_group=fr.roumoulou
archives_base_name=travellingdimension

# Les maps de l'entrepôt copiées dans les saves des clients de dev : noms exacts,
# séparés par des virgules, catégorie jamais mentionnée. Clé absente ou vide :
# toutes les maps de l'entrepôt. machine.properties peut la surcharger par poste.
# Le monde du serveur ne dépend pas d'elle (il reste déclaré par le profil dev de
# l'entrepôt), et retirer une map d'ici n'efface pas sa copie déjà dans un run.
dev_maps=World_Flat_MushroomFields, \
  Learn Logic Gates, \
  Redstone Fully Explained, \
  Redstone Tutorial World, \
  All Redstone Circuits and Logic Gates, \
  Resource Pack Showcase 1.21.4

# Mods de l'instance à ne JAMAIS copier dans les runs moddés : identifiants Fabric
# (champ id du fabric.mod.json), séparés par des virgules ; machine.properties peut
# surcharger par poste. Pour les mods qui cassent les runs sans casser l'instance.
# Vide depuis le 2026-09-25 : l'exclusion de xaeroworldmap, posée le 2026-09-13 (le duo
# MaLiLib + World Map crashait au premier tick DANS LES RUNS seulement : Missing uniform
# Globals, animation d'atlas), est levée pour le re-test sous Iris 1.11.4 et Sodium 0.9.2.
# Si le premier tick crashe encore, remettre `xaeroworldmap` ici : la synchronisation
# retire le jar toute seule.
dev_mods_exclude=

# Les logs des runs, trois clés indépendantes (les montages vivent dans log4j\).
# dev_log_level règle la console de TOUT LE MONDE (trace, debug, info, warn, error ;
# vide = info, le défaut Fabric) ; dev_mod_log_level ne règle que le logger du mod,
# pour voir son debug ou son trace sans le bruit des autres. machine.properties peut
# surcharger par poste, -P dépanne ponctuellement, et logs/debug.log reçoit toujours
# tout, quels que soient ces réglages.
dev_log_level=info
dev_mod_log_level=trace

# Le FORMAT de la console : vide = l'habillage de Loom ; `compact` (une ligne, emoji
# par niveau, héritier du soft-compact d'Enhanced Terminal Logging) ou `details`
# (deux lignes avec Classe::Méthode(Ligne) et PID, le diagnostic poussé, plus lent).
dev_log_format=compact

# Le joueur des runs client. dev_username donne un pseudo fixe hors ligne (sans lui,
# Minecraft invente « Player » suivi de trois chiffres à chaque lancement) : même joueur,
# mêmes données de joueur dans les mondes de dev. dev_login=true branche à la place le
# compte Microsoft enregistré par `gradlew microsoftLogin` (flux « device code » : la
# connexion se fait dans le navigateur, le jeton chiffré vit dans le cache Loom du Gradle
# user home, jamais dans le projet) ; le pseudo fixe s'efface alors devant le vrai compte.
# machine.properties peut surcharger les deux par poste.
dev_username=Roumoulou
dev_login=false
