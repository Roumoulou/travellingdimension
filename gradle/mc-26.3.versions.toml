# Ce qui suit la version 26.3 du jeu (alias `mc263`). Lu par le module mc-26.3. Mêmes
# clés que les autres catalogues de version, sauf ce que seul common lit : l'écran de
# configuration se compile contre la plus ancienne version servie (mc-26.2.versions.toml)
# et tourne ici sur Mod Menu 21 et Cloth Config 26.3, dont l'API qu'il emploie n'a pas
# bougé (ModMenuApi, ConfigScreenFactory, ConfigBuilder, ConfigEntryBuilder, ses builders :
# comparaison des dépôts des deux mods, 2026-10-02).

[versions]

minecraft = "26.3" # Version de Minecraft ciblée (release du 2026-09-15, non obfusquée)
fabric-api = "0.161.0+26.3" # Fabric API : ensemble d'APIs haut niveau pour les mods (events, registries, networking...)

# Le module GameTest de Fabric API, absent du jar agrégé : l'étage 2 des tests, le serveur
# GameTest de Loom. Sa version se lit dans le POM de fabric-api, dépendance
# fabric-gametest-api-v1, et se monte avec elle.
fabric-gametest-api = "4.0.32+3434d6d95d"


[libraries]

minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric-gametest-api = { module = "net.fabricmc.fabric-api:fabric-gametest-api-v1", version.ref = "fabric-gametest-api" }
