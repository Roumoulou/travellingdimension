# Ce qui suit la version 26.2 du jeu (alias `mc262`). Lu par le module mc-26.2. Les
# catalogues de version portent les mêmes clés : un module de version ne diffère du
# suivant que par l'alias qu'il lit.

[versions]

minecraft = "26.2" # Version de Minecraft ciblée (release, non obfusquée)
fabric-api = "0.161.0+26.2" # Fabric API : ensemble d'APIs haut niveau pour les mods (events, registries, networking...)

# Le module GameTest de Fabric API, absent du jar agrégé : l'étage 2 des tests, le serveur
# GameTest de Loom. Sa version se lit dans le POM de fabric-api, dépendance
# fabric-gametest-api-v1, et se monte avec elle.
fabric-gametest-api = "4.0.22+4a7fa0819e"

# Écran de configuration en jeu. Ces deux-là sont FACULTATIFS : jamais embarqués, jamais
# exigés. Le mod tourne sans, et les runs de dev restent vanilla purs. L'écran se compile
# dans common, contre ceux de la dernière release ; le module mc-26.2 pose ceux-ci pour
# sa vérification de compatibilité, qui prouve que l'écran trouve leur API en 26.2.
# L'instance Prism « modded » les porte déjà, c'est là que l'écran se teste en jeu.
modmenu = "20.0.3" # Mod Menu : la liste des mods et le bouton « config »
cloth-config = "26.2.155" # Cloth Config API : les widgets de l'écran de config


[libraries]

minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric-gametest-api = { module = "net.fabricmc.fabric-api:fabric-gametest-api-v1", version.ref = "fabric-gametest-api" }

modmenu = { module = "com.terraformersmc:modmenu", version.ref = "modmenu" }
cloth-config = { module = "me.shedaniel.cloth:cloth-config-fabric", version.ref = "cloth-config" }
